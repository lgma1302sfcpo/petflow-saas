services:
  postgres:
    image: postgres:17-alpine
    container_name: petshop-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petshop_saas
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop_dev
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - petshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petshop -d petshop_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petshop_postgres_data:
